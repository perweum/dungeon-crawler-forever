name: Release
# Push a tag like v0.2.0 -> checks it matches the TOC version, builds dist/DungeonCrawlerForever-<version>.zip, attaches it to a
# GitHub release and, if the CurseForge secrets are set, uploads the same zip to CurseForge.
#   secret   CF_API_KEY            CurseForge API token (author account settings)
#   variable CF_PROJECT_ID         numeric project id (shown on the CurseForge project page)
#   variable CF_GAME_VERSION_IDS   comma separated game version ids (list them: CF_API_KEY=... python3 tools/upload_curseforge.py --list-versions)
#   variable CF_RELEASE_TYPE       optional: alpha | beta | release (default beta; tags like v0.2.0-beta1 / -alpha1 override)
# Without the secret the CurseForge step is skipped and the workflow still succeeds.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
      CF_GAME_VERSION_IDS: ${{ vars.CF_GAME_VERSION_IDS }}
      CF_RELEASE_TYPE: ${{ vars.CF_RELEASE_TYPE }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag must match the TOC version
        run: |
          toc=$(sed -n 's/^## Version: *//p' addon/DungeonCrawlerForever/DungeonCrawlerForever.toc | tr -d '\r')
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          if [ "$base" != "$toc" ]; then echo "tag $GITHUB_REF_NAME does not match TOC version $toc"; exit 1; fi
      - run: python3 tools/package.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
      - name: Upload to CurseForge
        if: env.CF_API_KEY != '' && env.CF_PROJECT_ID != '' && env.CF_GAME_VERSION_IDS != ''
        run: python3 tools/upload_curseforge.py dist/DungeonCrawlerForever-*.zip --tag "$GITHUB_REF_NAME"
